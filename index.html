<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Web Siri</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: white;
    }
    #orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
      margin-top: 20px;
      user-select: none;
    }
    #orb.listening {
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 40px rgba(79, 172, 254, 0.8);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    #status { margin-top: 20px; font-size: 1.1rem; color: #aaa; }
    #transcript { margin-top: 15px; font-size: 1.3rem; text-align: center; max-width: 80%; }
  </style>
</head>
<body>

  <div id="orb">Tap to Speak</div>
  <div id="status">Tap the orb to speak</div>
  <div id="transcript"></div>

  <script>
    // Integrated API key from Google AI Studio
    const API_KEY = "AQ.Ab8RN6IcLo3fZys4CqHeSGQLPKaZn8YEub4iTNnoqS7RF3F-vg";

    const orb = document.getElementById('orb');
    const statusText = document.getElementById('status');
    const transcriptText = document.getElementById('transcript');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusText.innerText = "Speech Recognition not supported. Please use Google Chrome.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      const synth = window.speechSynthesis;

      orb.addEventListener('click', () => {
        // Only blocks if the key is empty or still default placeholder text
        if (!API_KEY || API_KEY === "PASTE_YOUR_GEMINI_API_KEY_HERE") {
          alert("Please paste your Gemini API key inside the index.html code first!");
          return;
        }
        synth.cancel();
        recognition.start();
        orb.classList.add('listening');
        statusText.innerText = "Listening...";
        transcriptText.innerText = "";
      });

      recognition.onresult = async (event) => {
        orb.classList.remove('listening');
        const userSpoke = event.results[0][0].transcript;
        transcriptText.innerText = `"${userSpoke}"`;
        statusText.innerText = "Thinking...";

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userSpoke }] }],
              systemInstruction: { parts: [{ text: "You are a concise voice assistant like Siri. Keep answers under 2 sentences." }] }
            })
          });

          const data = await response.json();

          if (data.error) {
            throw new Error(data.error.message || "API Error");
          }

          const aiText = data.candidates[0].content.parts[0].text;

          statusText.innerText = "Responding...";
          const utterance = new SpeechSynthesisUtterance(aiText);
          utterance.onend = () => { statusText.innerText = "Tap orb to speak"; };
          synth.speak(utterance);

        } catch (error) {
          console.error("Gemini API Error:", error);
          statusText.innerText = "Error: " + error.message;
        }
      };

      recognition.onerror = (event) => {
        orb.classList.remove('listening');
        statusText.innerText = "Error: " + event.error;
      };
    }
  </script>
</body>
</html>
