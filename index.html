<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siri v2.0</title>
  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f5f5f7;
      --text-sub: #86868b;
      --siri-blue: #00d2ff;
      --siri-purple: #92fe9d;
      --siri-pink: #ff2a8d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background blur */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0,210,255,0.15) 0%, rgba(255,42,141,0.1) 50%, rgba(0,0,0,0) 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 440px;
      padding: 40px 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    /* Siri Orb Container */
    .orb-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .orb {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 50%, #92fe9d 100%);
      background-size: 200% 200%;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 198, 255, 0.4);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(0, 198, 255, 0.6);
    }

    .orb-glow {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2a8d 0%, #00d2ff 100%);
      filter: blur(15px);
      opacity: 0.5;
      z-index: 1;
      transition: all 0.4s ease;
    }

    /* Orb Animations */
    .orb.listening {
      animation: gradientShift 2s ease infinite, pulseOrb 1.2s ease-in-out infinite alternate;
      background: linear-gradient(135deg, #ff2a8d 0%, #ff6a00 50%, #00d2ff 100%);
      background-size: 200% 200%;
    }

    .orb.listening + .orb-glow {
      opacity: 0.9;
      transform: scale(1.3);
      filter: blur(25px);
      animation: rotateGlow 3s linear infinite;
    }

    .orb.thinking {
      animation: rotateGlow 1.5s linear infinite;
      background: linear-gradient(135deg, #7F00FF 0%, #E100FF 100%);
    }

    @keyframes pulseOrb {
      0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 42, 141, 0.5); }
      100% { transform: scale(1.12); box-shadow: 0 0 60px rgba(0, 210, 255, 0.8); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1.2); }
    }

    /* Wave visualizer */
    .wave-container {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 20px;
      margin-top: 15px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .wave-container.active {
      opacity: 1;
    }

    .bar {
      width: 3px;
      height: 100%;
      background: var(--siri-blue);
      border-radius: 3px;
      animation: wave 1s ease-in-out infinite;
    }

    .bar:nth-child(2) { animation-delay: 0.1s; background: #ff2a8d; }
    .bar:nth-child(3) { animation-delay: 0.2s; background: #92fe9d; }
    .bar:nth-child(4) { animation-delay: 0.3s; background: #00c6ff; }
    .bar:nth-child(5) { animation-delay: 0.4s; background: #ff2a8d; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }

    #status {
      margin-top: 15px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-sub);
      transition: color 0.3s ease;
    }

    #transcript {
      margin-top: 18px;
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-main);
      min-height: 50px;
      word-break: break-word;
    }

    .hint {
      margin-top: 25px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="container">
    <div class="brand">Siri v2.0</div>

    <div class="orb-wrapper">
      <div id="orb" class="orb"></div>
      <div class="orb-glow"></div>
    </div>

    <div id="wave" class="wave-container">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div id="status">Tap orb to speak</div>
    <div id="transcript"></div>

    <div class="hint">Powered by Groq • Llama 3.3 70B</div>
  </div>

  <script>
    const API_KEY = "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";

    const orb = document.getElementById('orb');
    const wave = document.getElementById('wave');
    const statusText = document.getElementById('status');
    const transcriptText = document.getElementById('transcript');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusText.innerText = "Speech Recognition not supported in this browser. Try Chrome.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      const synth = window.speechSynthesis;

      orb.addEventListener('click', () => {
        if (!API_KEY || API_KEY.includes("PASTE_YOUR")) {
          alert("Please enter a valid API key inside index.html!");
          return;
        }

        synth.cancel();
        try {
          recognition.start();
          orb.className = "orb listening";
          wave.classList.add('active');
          statusText.innerText = "Listening...";
          statusText.style.color = "#00d2ff";
          transcriptText.innerText = "";
        } catch (e) {
          console.log("Recognition already active");
        }
      });

      recognition.onresult = async (event) => {
        orb.className = "orb thinking";
        wave.classList.remove('active');
        const userSpoke = event.results[0][0].transcript;
        transcriptText.innerText = `"${userSpoke}"`;
        statusText.innerText = "Thinking...";
        statusText.style.color = "#ff2a8d";

        try {
          const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
              model: "llama-3.3-70b-versatile",
              messages: [
                { role: "system", content: "You are Siri v2.0, an intelligent, elegant, and concise voice assistant. Answer concisely in under 2 short sentences." },
                { role: "user", content: userSpoke }
              ]
            })
          });

          const data = await response.json();

          if (data.error) {
            throw new Error(data.error.message || "API Error");
          }

          const aiText = data.choices[0].message.content;

          orb.className = "orb";
          statusText.innerText = "Responding...";
          statusText.style.color = "#92fe9d";

          const utterance = new SpeechSynthesisUtterance(aiText);
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          
          utterance.onend = () => { 
            statusText.innerText = "Tap orb to speak";
            statusText.style.color = "#86868b";
          };

          synth.speak(utterance);

        } catch (error) {
          console.error(error);
          orb.className = "orb";
          wave.classList.remove('active');
          statusText.innerText = "Error: " + error.message;
          statusText.style.color = "#ff4757";
        }
      };

      recognition.onerror = (event) => {
        orb.className = "orb";
        wave.classList.remove('active');
        statusText.innerText = "Error: " + event.error;
        statusText.style.color = "#ff4757";
      };

      recognition.onend = () => {
        if (orb.classList.contains("listening")) {
          orb.className = "orb";
          wave.classList.remove('active');
          statusText.innerText = "Tap orb to speak";
          statusText.style.color = "#86868b";
        }
      };
    }
  </script>
</body>
</html>
